<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python練習 | koppepandayo</title>
<meta name="description" content="ブラウザで動くPython練習問題集。実際にコードを実行して自動採点します。">
<link rel="icon" href="assets/koppecat.jpg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="python-practice.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<header class="hero pp-hero">
  <nav class="nav">
    <a class="nav-logo" href="index.html">koppepandayo</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#links">Links</a>
    </div>
  </nav>
  <div class="pp-hero-content">
    <p class="hero-eyebrow">// python practice</p>
    <h1 class="pp-title">Python<span class="accent">練習</span></h1>
    <p class="pp-subtitle">ブラウザ上で実際にPythonコードを実行して自動採点します(インストール不要)</p>
  </div>
</header>

<main class="pp-main">
  <div id="pp-loading" class="pp-loading card">
    <div class="pp-spinner"></div>
    <p id="pp-loading-text">Python実行環境を読み込み中...</p>
  </div>

  <div id="pp-app" class="pp-layout hidden">
    <aside class="pp-sidebar card">
      <div id="pp-problem-list"></div>
    </aside>

    <section class="pp-panel">
      <div class="card pp-desc-card">
        <h2 id="pp-title">問題を選んでください</h2>
        <p id="pp-difficulty" class="pp-difficulty"></p>

        <div id="pp-lesson-section" class="pp-lesson-section">
          <h3 class="pp-subheading">📖 文法解説</h3>
          <div id="pp-lesson" class="pp-lesson"></div>
        </div>

        <h3 class="pp-subheading">📝 問題</h3>
        <div id="pp-description" class="pp-description"></div>
      </div>

      <div class="card pp-editor-card">
        <div class="pp-editor-header">
          <span>コード</span>
          <div class="pp-editor-buttons">
            <button id="pp-reset-btn" class="btn btn-ghost pp-btn-sm" type="button">スターターコードに戻す</button>
            <button id="pp-run-btn" class="btn btn-primary pp-btn-sm" type="button" disabled>実行して採点</button>
          </div>
        </div>
        <textarea id="pp-code" class="pp-code" spellcheck="false" disabled></textarea>
      </div>

      <div class="card pp-result-card">
        <div class="pp-result-header">
          <span>実行結果</span>
          <span id="pp-status" class="pp-status"></span>
        </div>
        <div id="pp-result" class="pp-result"></div>
      </div>
    </section>
  </div>
</main>

<footer class="footer">
  <p>&copy; 2026 koppepandayo</p>
</footer>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
<script src="python-practice.js"></script>
</body>
</html>
