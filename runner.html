<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Runner | koppepandayo</title>
<meta name="description" content="こっぺ猫で遊べるオフライン恐竜ゲーム風ランナー">
<link rel="icon" href="assets/koppecat.jpg">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/tetris.css">
<link rel="stylesheet" href="assets/css/runner.css">
</head>
<body>
<div class="bg-grid"></div><div class="bg-glow runner-glow"></div>

<header class="hero tetris-hero">
  <nav class="nav">
    <a class="nav-logo" href="index.html">koppepandayo</a>
    <div class="nav-links"><a href="games.html">ミニゲーム</a><a href="games-solo.html">ソロ選択</a></div>
    <div class="audio-control">
      <button id="music-toggle" class="audio-btn" type="button" aria-label="音楽のオン・オフ">♫</button>
      <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" value="25" aria-label="音量">
    </div>
  </nav>
</header>

<main class="runner-main">
  <div class="runner-heading">
    <div><p class="hero-eyebrow">// koppe cat run</p><h1>CAT RUNNER</h1></div>
  </div>

  <section class="runner-stage card" aria-label="ランナーゲーム"></section>
  <div class="icon-offline" style="display:none"></div>
  <div id="offline-resources" style="display:none">
    <img id="offline-resources-1x" src="assets/runner-sprite-1x.png">
    <img id="offline-resources-2x" src="assets/runner-sprite-2x.png">
  </div>

  <div class="runner-help card">
    <span><b>Space / ↑</b> ジャンプ</span><span><b>↓</b> しゃがむ</span><span>タップでジャンプ(モバイル)</span>
  </div>
  <p class="runner-credit">
    <a href="https://github.com/wayou/t-rex-runner" target="_blank" rel="noopener">Chromium Dino Game</a>
    (BSD-3-Clause, <a href="https://chromium.googlesource.com/chromium/src/+/main/components/neterror/resources/dino_game/" target="_blank" rel="noopener">元はChromium</a>)のコードをベースにしています。キャラクター画像だけをこっぺ猫に差し替えています。
  </p>
</main>

<script src="assets/js/tetris-audio.js"></script>
<script src="assets/js/runner.js"></script>
</body>
</html>
