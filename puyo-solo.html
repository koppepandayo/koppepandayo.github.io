<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぷよソロ | koppepandayo</title>
<meta name="description" content="色を4つ以上つなげて連鎖を狙うソロパズルゲーム">
<link rel="icon" href="assets/koppecat.jpg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tetris.css">
<link rel="stylesheet" href="puyo.css">
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow puyo-glow"></div>

<header class="hero tetris-hero">
  <nav class="nav">
    <a class="nav-logo" href="index.html">koppepandayo</a>
    <div class="nav-links">
      <a href="games.html">ミニゲーム</a>
      <a href="games-solo.html">ソロ選択</a>
    </div>
    <div class="audio-control">
      <button id="music-toggle" class="audio-btn" type="button" aria-label="音楽のオン・オフ">♫</button>
      <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" value="25" aria-label="音量">
    </div>
  </nav>
</header>

<main class="tetris-main puyo-main">
  <h1 class="tetris-title puyo-title">COLOR CHAIN</h1>

  <div class="solo-grid">
    <div class="solo-game-area">
      <div class="tetris-layout puyo-layout">
        <div class="tetris-side">
          <div class="card tetris-panel"><span class="panel-label">SCORE</span><p id="score" class="panel-value">0</p></div>
          <div class="card tetris-panel"><span class="panel-label">CHAIN</span><p id="chain" class="panel-value">0</p></div>
          <div class="card tetris-panel"><span class="panel-label">MAX CHAIN</span><p id="max-chain" class="panel-value">0</p></div>
          <div class="card tetris-panel"><span class="panel-label">HIGH SCORE</span><p id="high-score" class="panel-value">0</p></div>
        </div>

        <div class="tetris-board-wrap puyo-board-wrap">
          <canvas id="puyo-board-canvas" width="288" height="576"></canvas>
          <div id="clear-toast" class="clear-toast"></div>
          <div id="overlay" class="tetris-overlay">
            <div class="overlay-message"><p id="overlay-text">Ready?</p><p id="overlay-score"></p></div>
            <button id="start-btn" class="btn btn-primary">はじめる</button>
          </div>
        </div>

        <div class="tetris-touch puyo-touch">
          <button data-action="left" aria-label="左に移動">◀</button>
          <button data-action="rotate-ccw" aria-label="左回転">↶</button>
          <button data-action="rotate" aria-label="右回転">↷</button>
          <button data-action="right" aria-label="右に移動">▶</button>
          <button data-action="down" aria-label="高速落下">▼</button>
          <button data-action="drop" aria-label="一気に落下">⇩</button>
        </div>

        <div class="tetris-side">
          <div class="card tetris-panel">
            <span class="panel-label">NEXT</span>
            <canvas id="puyo-next-canvas" width="96" height="210"></canvas>
          </div>
          <div class="card tetris-panel tetris-help">
            <span class="panel-label">操作</span>
            <p>← → : 移動</p><p>↓ : 高速落下</p><p>↑ / X : 右回転</p><p>Z : 左回転</p><p>Space : 一気に落下</p><p>P : ポーズ</p>
          </div>
        </div>
      </div>

    </div>

    <aside class="card solo-ranking-panel">
      <p class="modal-title">🏆 ぷよランキング</p>
      <p class="account-note ranking-hint">Discordでログインしたプレイだけ記録されます。<a href="games.html">アカウント設定</a></p>
      <p id="ranking-loading" class="account-note">読み込み中...</p>
      <ol id="solo-ranking-list" class="ranking-list"></ol>
    </aside>
  </div>

  <p class="puyo-credit">セガ公式「ぷよぷよプログラミング」教材を参考にした非商用の学習作品です。独自実装・独自素材を使用しています。© SEGA</p>
</main>

<script src="puyo-engine.js"></script>
<script src="tetris-audio.js"></script>
<script src="puyo.js"></script>
</body>
</html>
